<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ATMAVOX · Consciência, presença e expansão</title>
    <meta
      name="description"
      content="ATMAVOX, de Andreía Oliveirà. Consciência, presença e expansão: áudios, encontros e jornadas para perceber possibilidades que você ainda não percebeu."
    />
    <meta name="theme-color" content="#ebe2d4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Aplica o tema antes da primeira pintura, para a página não "piscar". Espelha theme.ts:
         a escolha salva vence; sem escolha, claro. -->
    <script>
      ;(function () {
        var theme = 'light'
        try {
          var stored = localStorage.getItem('atmavox:theme')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (e) {}
        document.documentElement.dataset.theme = theme
        if (theme === 'dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#211a14')
      })()
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://atmavox.github.io/" />
    <meta property="og:title" content="ATMAVOX · Consciência, presença e expansão" />
    <meta
      property="og:description"
      content="Áudios, encontros e jornadas com Andreía Oliveirà, para perceber possibilidades que você ainda não percebeu."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
