name: Checar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A cada 6 horas, para a página inicial trazer a última publicação das redes (ADR-028).
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Um deploy em andamento na main nunca é cancelado no meio; em PR, só a checagem mais nova importa.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Checar e gerar o build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Buscar as últimas publicações das redes
        # Uma rede que falhar fica de fora; sem nenhuma, a página inicial mostra só os ícones (ADR-028).
        # A chave do Instagram é secreta; o vídeo do TikTok e o feed do podcast são Variables.
        continue-on-error: true
        run: node scripts/fetch-social.ts
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          SOCIAL_TIKTOK_URL: ${{ vars.SOCIAL_TIKTOK_URL }}
          SOCIAL_SPOTIFY_RSS: ${{ vars.SOCIAL_SPOTIFY_RSS }}
      - run: npm run build
        # Configuração web do Firebase (pública por natureza; a segurança está nas regras do Firestore).
        # Sem estas variáveis o site funciona e o botão "Entrar" simplesmente não aparece.
        # Lê das Variables do repositório ou, se não houver, dos Secrets com o mesmo nome.
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          # Endereço do Worker de pagamentos (ADR-023). Sem ela, o botão mostra "Pagamento em breve".
          VITE_PAYMENTS_URL: ${{ vars.VITE_PAYMENTS_URL }}
      - name: Guardar o build para publicação
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
